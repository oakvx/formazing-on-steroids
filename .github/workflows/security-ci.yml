name: Security and offline regression

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    name: Python security regression (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal isolated test dependencies
        run: python -m pip install Flask==3.1.2 pytest==8.4.2
      - name: Syntax check for all Python source
        run: python -m compileall -q app config.py run.py tests/security
      - name: Offline security and log viewer tests
        run: python -m pytest -q -o addopts= --confcutdir=tests/security tests/security/
